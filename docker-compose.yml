services:
  postgres:
    image: postgres:16
    container_name: isg-second-brain-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isg_brain}
      POSTGRES_USER: ${POSTGRES_USER:-isg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma
    container_name: isg-second-brain-chromadb
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
